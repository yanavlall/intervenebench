name: public-evaluation-smoke

on:
  push:
  pull_request:

jobs:
  public-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify public-safe evaluation components
        run: |
          python -m pytest -q \
            tests/test_release_decision.py \
            tests/test_model_regression.py \
            tests/test_results_explorer.py \
            tests/test_role_focused_program.py \
            tests/test_public_case_study.py::test_checked_in_public_bundle_verifies_and_renders
      - name: Recompute public release decisions
        run: python -m intervenebench.cli public-case-study
